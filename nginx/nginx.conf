worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Лимиты для больших файлов (до 10 ГБ)
    client_max_body_size 10G;
    client_body_buffer_size 512k;

    # Оптимальное сжатие интерфейса
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json text/css text/plain text/xml;

    server {
        listen 80;
        server_name nextcloud.standcat.ru;
        root /var/www/html;

        index index.php index.html /index.php$request_uri;

        # Главные заголовки безопасности
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy no-referrer always;

        # WebDAV/CardDAV редиректы для iOS/Android
        location = /.well-known/carddav {
            return 301 $scheme://$host/remote.php/dav;
        }
        location = /.well-known/caldav {
            return 301 $scheme://$host/remote.php/dav;
        }

        # Защита: точечная изоляция системных директорий (оригинальная логика)
        location ~ ^\/(?:build|tests|config|lib|3rdparty|templates|data)\/ {
            deny all;
        }
        location ~ ^\/(?:\.|autotest|occ|issue|indie|db_|console) {
            deny all;
        }

        # Проксирование PHP-запросов в контейнер app
        location ~ \.php(?:$|/) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            fastcgi_pass app:9000;

            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info; # <-- ИСПРАВЛЕНО НА ПРАВИЛЬНУЮ ПЕРЕМЕННУЮ
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;

            fastcgi_request_buffering off;
            fastcgi_read_timeout 3600;