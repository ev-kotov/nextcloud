worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Лимиты и таймауты для больших файлов (до 10 ГБ)
    client_max_body_size 10G;
    client_body_buffer_size 512k;
    client_body_timeout 3600s;

    # Буферы для защиты от ложных 403 при передаче тяжелых Cookies/Токенов
    client_header_buffer_size 16k;
    large_client_header_buffers 4 16k;

    # Оптимальное сжатие интерфейса
    gzip on;
    gzip_vary on;
    gzip_types application/javascript application/json text/css;

    server {
        listen 80;
        server_name nextcloud.standcat.ru;
        root /var/www/html;
        index index.php;

        # Главные заголовки безопасности
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy no-referrer always;

        # WebDAV/CardDAV редиректы для iOS/Android клиентов
        location = /.well-known/carddav { return 301 $scheme://$host/remote.php/dav; }
        location = /.well-known/caldav  { return 301 $scheme://$host/remote.php/dav; }

        # Защита: блокируем только скрытые файлы вроде .htaccess
        location ~ /\. { deny all; }

        # Прямая отдача статики из папок Nextcloud. Если файла нет — уходит на фронт-контроллер.
        # Это полностью убирает ошибку 403 Forbidden с Дашборда и Настроек.
        location ~ ^/(?:apps|assets|core|dist|enterprise|ocm-provider|ocs|ocs-provider|settings|themes|updater)/ {
            try_files $uri /index.php$request_uri;
            expires 6M;
            access_log off;
        }

        # Универсальное проксирование ВСЕХ PHP-запросов (включая index, remote, cron и status)
        location ~ \.php(?:$|/) {
            fastcgi_split_path_info ^(.+?\.php)(/.*)$;
            fastcgi_pass app:9000;
            
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param PATH_INFO $fastcgi_path_info;
            
            fastcgi_param modHeadersAvailable true;
            fastcgi_param front_controller_active true;
            
            fastcgi_request_buffering off;
            fastcgi_read_timeout 120;
        }

        # Роутинг для корня и остальных статических запросов
        location / {
            try_files $uri $uri/ /index.php$request_uri;
        }
    }
}