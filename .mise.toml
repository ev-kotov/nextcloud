[settings]
env_shell_expand = false

[env]
NEXTCLOUD_DB_HOST = "db"
NEXTCLOUD_DB_PORT = "5432"
NEXTCLOUD_DB_NAME = "nextcloud_db"
NEXTCLOUD_DB_USER = "postgres"       # Используем суперпользователя СУБД

NEXTCLOUD_REDIS_HOST = "redis"
NEXTCLOUD_REDIS_PORT = "6379"

NEXTCLOUD_TRUSTED_DOMAINS = "nextcloud.standcat.ru"
NEXTCLOUD_OVERWRITE_CLI_URL = "https://standcat.ru"

NEXTCLOUD_STACK_DIR = "/opt/stacks/nextcloud"
NEXTCLOUD_SRV_DIR = "/srv/nextcloud"

# Секреты администратора и БД
NEXTCLOUD_ADMIN_USER = "kot"
NEXTCLOUD_DB_PASSWORD = "o3kz3Ddmb4QNu7T9qliB20BvgXqPhFXhqGnjYtboVAo="
NEXTCLOUD_ADMIN_PASSWORD = "/v6fyfcaQZzErfUZ7t+k9bzmOg2Hf9Fuge8HvLdSmOk="


[tasks."prepare:deps"]
description = "[Шаг 1.1] Проверить и установить системные зависимости на хосте"
raw = true
run = '''
set -euo pipefail
MISSING=""
for pkg in policycoreutils-python-utils podman-compose jq rsync; do
  rpm -q "$pkg" >/dev/null 2>&1 || MISSING="$MISSING $pkg"
done
if [ -n "$MISSING" ]; then
  echo "Устанавливаю:$MISSING"
  sudo dnf install -y $MISSING
else
  echo "Все зависимости уже установлены"
fi
'''

[tasks."prepare:dirs"]
description = "[Шаг 1.2] Создать директории стека на хосте"
raw = true
run = '''
set -euo pipefail
sudo mkdir -p ${NEXTCLOUD_SRV_DIR}/data
mkdir -p ${NEXTCLOUD_STACK_DIR}/{app,nginx}
echo "Директории на хосте созданы."
'''

[tasks."prepare:ownership"]
description = "[Шаг 1.3] Выставить владельцев под UID контейнеров (Rootless www-data: 82)"
raw = true
run = '''
set -euo pipefail
sudo chown -R $(id -u):$(id -g) ${NEXTCLOUD_STACK_DIR}/{app,nginx}
sudo chown -R $(id -u):$(id -g) ${NEXTCLOUD_SRV_DIR}/data
podman unshare chown -R 82:82 ${NEXTCLOUD_STACK_DIR}/app
podman unshare chown -R 82:82 ${NEXTCLOUD_SRV_DIR}/data
echo "Права доступа настроены под Rootless Podman."
'''

[tasks."prepare:selinux"]
description = "[Шаг 1.4] Установить SELinux-контекст container_file_t"
raw = true
run = '''
set -euo pipefail
sudo semanage fcontext -a -t container_file_t "${NEXTCLOUD_SRV_DIR}(/.*)?" 2>/dev/null || sudo semanage fcontext -m -t container_file_t "${NEXTCLOUD_SRV_DIR}(/.*)?"
sudo semanage fcontext -a -t container_file_t "${NEXTCLOUD_STACK_DIR}(/.*)?" 2>/dev/null || sudo semanage fcontext -m -t container_file_t "${NEXTCLOUD_STACK_DIR}(/.*)?"
sudo restorecon -Rv ${NEXTCLOUD_SRV_DIR}
sudo restorecon -Rv ${NEXTCLOUD_STACK_DIR}
echo "SELinux-контексты обновлены."
'''

[tasks."prepare:networks"]
description = "[Шаг 1.5] Создать Podman-сети для стека и прокси"
run = '''
set -euo pipefail
podman network exists traefik-public || podman network create traefik-public
podman network exists nextcloud-internal || podman network create nextcloud-internal
echo "Сети готовы."
'''

[tasks."prepare"]
description = "[Шаг 1] Полная подготовка хоста (запуск всех подзадач prepare)"
depends = [
    "prepare:deps", 
    "prepare:dirs", 
    "prepare:ownership", 
    "prepare:selinux", 
    "prepare:networks"
]
run = "echo 'Хост успешно подготовлен к запуску стека.'"

# ПРОДАКШЕН И НАСТРОЙКА

[tasks."prod:up"]
description = "[Шаг 2] Запустить стек контейнеров через podman-compose"
dir = "{{env.NEXTCLOUD_STACK_DIR}}"
run = '''
set -euo pipefail
sudo rm -f /var/lib/cni/networks/nextcloud-internal/* 2>/dev/null || true
podman-compose up -d
echo "Контейнеры запущены. Сценарии автоустановки контейнера отключены."
'''

[tasks."prod:db-init"]
description = "[Шаг 3] Ожидание СУБД и принудительное создание чистой базы данных"
run = '''
set -euo pipefail
echo "Ожидание запуска PostgreSQL..."
until podman exec nextcloud-db pg_isready -U "postgres" -d "postgres" >/dev/null 2>&1; do
  sleep 2
done

echo "Принудительное пересоздание абсолютно чистой базы данных..."
podman exec nextcloud-db dropdb -U postgres "${NEXTCLOUD_DB_NAME}" --if-exists 2>/dev/null || true
podman exec nextcloud-db createdb -U postgres "${NEXTCLOUD_DB_NAME}"
echo "Кристально чистая база данных создана под суперпользователем postgres."
'''

[tasks."prod:install"]
description = "[Шаг 4] Контролируемая ручная инсталляция таблиц Nextcloud"
run = '''
set -euo pipefail
echo "Ожидание готовности контейнера приложения..."
until podman exec nextcloud-app [ -f /var/www/html/occ ] >/dev/null 2>&1; do
  sleep 2
done

echo "Запуск явной инсталляции таблиц Nextcloud под пользователем postgres..."
podman exec --user www-data nextcloud-app php occ maintenance:install \
  --database="pgsql" \
  --database-name="${NEXTCLOUD_DB_NAME}" \
  --database-host="${NEXTCLOUD_DB_HOST}" \
  --database-user="postgres" \
  --database-pass="${NEXTCLOUD_DB_PASSWORD}" \
  --admin-user="${NEXTCLOUD_ADMIN_USER}" \
  --admin-pass="${NEXTCLOUD_ADMIN_PASSWORD}"
echo "[OK] Nextcloud успешно установил все таблицы!"
'''

[tasks."prod:configure"]
description = "[Шаг 5] Финальная настройка параметров (trusted_domains, proxies)"
run = '''
set -euo pipefail
echo "Конфигурация trusted_proxies (подсети Podman)..."
podman exec --user www-data nextcloud-app php occ config:system:set trusted_proxies 0 --value="10.89.0.0/16"
podman exec --user www-data nextcloud-app php occ config:system:set trusted_proxies 1 --value="172.16.0.0/12"
podman exec --user www-data nextcloud-app php occ config:system:set trusted_domains 1 --value="${NEXTCLOUD_TRUSTED_DOMAINS}"
podman exec --user www-data nextcloud-app php occ config:system:set overwriteprotocol --value="https"

echo "Текущий статус приложения:"
podman exec --user www-data nextcloud-app php occ status
echo "============================================================="
echo "Стек полностью развернут, настроен и готов к работе!"
echo "============================================================="
'''

[tasks."prod:down"]
description = "Остановить стек контейнеров"
dir = "{{env.NEXTCLOUD_STACK_DIR}}"
run = "podman-compose down"

[tasks."prod:purge-data"]
description = "РАДИКАЛЬНОЕ УНИЧТОЖЕНИЕ: Полное удаление ВСЕХ файлов и томов баз данных с хоста"
run = '''
set -euo pipefail
echo "ВНИМАНИЕ! Уничтожаю именованные тома Podman для БД..."
podman volume rm $(podman volume ls -q | grep nextcloud) 2>/dev/null || true
echo "Удаляю локальные файлы Nextcloud с хоста..."
sudo rm -rf ${NEXTCLOUD_SRV_DIR}/data
sudo rm -rf ${NEXTCLOUD_STACK_DIR}/app/*
echo "[УНИЧТОЖЕНО] Все тома и файлы полностью стерты."
'''

[tasks."prod:clean"]
description = "БЕЗОПАСНАЯ ОЧИСТКА: Удалить контейнеры, кэш Podman и ТОЛЬКО код приложения"
dir = "{{env.NEXTCLOUD_STACK_DIR}}"
run = '''
set -euo pipefail
podman-compose down 2>/dev/null || true
podman rm -f nextcloud-db nextcloud-redis nextcloud-app nextcloud-cron nextcloud-nginx 2>/dev/null || true
sudo rm -f /var/lib/cni/networks/nextcloud-internal/* 2>/dev/null || true
echo "Удаляю только кэш кода приложения Nextcloud..."
sudo rm -rf ${NEXTCLOUD_STACK_DIR}/app/*
podman system prune -f
echo "[БЕЗОПАСНО] Контейнеры и конфиги стерты. База данных и файлы пользователей НЕ тронуты."
'''

[tasks."logs:all"]
description = "Посмотреть общие логи стека"
dir = "{{env.NEXTCLOUD_STACK_DIR}}"
run = "podman-compose logs -f --tail=50"

[tasks."occ"]
description = "Утилита occ для ручного управления"
run = 'podman exec --user www-data nextcloud-app php occ "$@"'